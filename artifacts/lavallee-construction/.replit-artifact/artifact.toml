kind = "web"
previewPath = "/"
title = "MZT Construction"
description = "Site vitrine en français pour MZT Construction (2018) inc. : construction résidentielle et commerciale, réfection et déneigement de toiture, revêtement extérieur, rénovation résidentielle et demande de soumission."
version = "1.0.0"
id = "artifacts/lavallee-construction"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20943

[services.development]
run = "pnpm --filter @workspace/lavallee-construction run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lavallee-construction", "run", "build" ]
serve = "static"
publicDir = "artifacts/lavallee-construction/dist/public"

[[services.production.rewrites]]
from = "/soumission"
to = "/soumission/index.html"

[[services.production.rewrites]]
from = "/soumission/"
to = "/soumission/index.html"

[[services.production.rewrites]]
from = "/politique-de-confidentialite"
to = "/politique-de-confidentialite/index.html"

[[services.production.rewrites]]
from = "/politique-de-confidentialite/"
to = "/politique-de-confidentialite/index.html"

[services.env]
PORT = "20943"
BASE_PATH = "/"
