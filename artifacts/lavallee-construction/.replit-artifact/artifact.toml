kind = "web"
previewPath = "/"
title = "MZT Construction"
description = "Site vitrine en français pour MZT Construction (2018) inc., présentant ses services de construction, rénovation, toiture et béton estampé, ses coordonnées et son formulaire de soumission."
version = "1.0.0"
id = "artifacts/lavallee-construction"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20943

[services.development]
run = "pnpm --filter @workspace/lavallee-construction run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lavallee-construction", "run", "build" ]
serve = "static"
publicDir = "artifacts/lavallee-construction/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20943"
BASE_PATH = "/"
