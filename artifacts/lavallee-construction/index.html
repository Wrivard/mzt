<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script data-cookieconsent="ignore">
      document.documentElement.setAttribute("data-app-loading", "");
      window.setTimeout(function () {
        document.documentElement.removeAttribute("data-app-loading");
      }, 8000);
    </script>
    <style>
      #app-startup { display: none; }
      html[data-app-loading] #root { visibility: hidden; }
      html[data-app-loading] #app-startup {
        display: grid; position: fixed; inset: 0; z-index: 100;
        place-content: center; justify-items: center; gap: 20px;
        background: #1b1b1b; color: #fff;
        font: 14px/1.5 system-ui, sans-serif;
      }
      #app-startup img { display: block; width: 160px; height: auto; }
      #app-startup p { margin: 0; }
      .startup-progress {
        width: min(200px, 65vw); height: 4px; overflow: hidden;
        border-radius: 999px; background: #ffffff26;
      }
      .startup-progress::after {
        content: ""; display: block; width: 45%; height: 100%;
        border-radius: inherit; background: #80a800;
        animation: startup-progress-slide 1.3s ease-in-out infinite;
      }
      @keyframes startup-progress-slide {
        from { transform: translateX(-110%); }
        to { transform: translateX(325%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .startup-progress::after { animation: none; width: 100%; }
      }
    </style>
    <title>Construction, rénovation et toiture | MZT Construction</title>
    <meta name="description" content="Construction résidentielle et commerciale, rénovation, toiture et revêtement extérieur : découvrez MZT Construction et demandez une soumission pour vos travaux." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Construction, rénovation et toiture | MZT Construction" />
    <meta property="og:description" content="Construction résidentielle et commerciale, rénovation, toiture et revêtement extérieur : découvrez MZT Construction et demandez une soumission pour vos travaux." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Construction, rénovation et toiture | MZT Construction" />
    <meta name="twitter:description" content="Construction résidentielle et commerciale, rénovation, toiture et revêtement extérieur : découvrez MZT Construction et demandez une soumission pour vos travaux." />
    <link rel="stylesheet" href="/src/index.css" />
    <link rel="icon" type="image/png" sizes="48x48" href="/images/optimized/favicon-48.png" />
    <link rel="preload" as="image" href="/images/optimized/logo-mzt-512.webp" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/plus-jakarta-sans-latin.woff2" crossorigin />
  </head>
  <body>
    <div id="app-startup" role="status" aria-live="polite">
      <img src="/images/optimized/logo-mzt-512.webp" alt="MZT Construction" width="160" height="114" />
      <div class="startup-progress" role="progressbar" aria-label="Chargement du site"></div>
      <p>Chargement du site…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx" data-cookieconsent="ignore"></script>
  </body>
</html>
